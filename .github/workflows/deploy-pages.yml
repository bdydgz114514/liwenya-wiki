name: Deploy site to GitHub Pages

# 默认只手动触发（workflow_dispatch）。
#
# 为什么不是 push 自动发布：本站当前的发布路径是「本地构建 → 产物推到
# bdydgz114514/bdydgz114514.github.io 仓库（branch 源）」，本仓库的 Pages 源
# 并不是 “GitHub Actions”。在那种设置下 actions/deploy-pages 必然失败
# （build 成功、deploy 报 Pages site not found / source 不匹配），
# 每次 push 都会留一条红色记录。
#
# 如果你想改成由本仓库自动发布：
#   1. 打开此 workflow，取消注释下面的 push 触发器；
#   2. 仓库 Settings → Pages → Build and deployment → Source 选择 “GitHub Actions”；
#   3. 注意站点地址会变成 https://bdydgz114514.github.io/liwenya-wiki/（子路径），
#      而当前所有链接都是根路径绝对路径，需要给 astro.config.mjs 配 base 才能正常显示。
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (astro build + pagefind index)
        run: npm run build
        env:
          SITE_URL: https://bdydgz114514.github.io

      - name: Sanity check the build output
        run: |
          test -f dist/.nojekyll || { echo "缺少 dist/.nojekyll：Pages 的 Jekyll 会忽略 _astro/"; exit 1; }
          test -f dist/index.html || { echo "缺少 dist/index.html"; exit 1; }
          test -f dist/search-index.json || { echo "缺少 dist/search-index.json"; exit 1; }
          if [ ! -f dist/pagefind/pagefind.js ]; then
            echo "::warning::pagefind 索引未生成，/search 将退化为 JSON 兜底搜索"
          fi
          echo "HTML 页面数：$(find dist -name '*.html' | wc -l)"
          du -sh dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
